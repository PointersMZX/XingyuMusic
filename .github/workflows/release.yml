# XingyuMusic 发布流水线
# 触发：推送 v* tag → CI 打 Android APK，并创建 GitHub Release
# Windows 端（NSIS 安装版）由维护者自行上传到 Release 页面
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: XingyuMusic-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node（.nvmrc = v18）
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components（compileSdk 36 / build-tools 35）
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Assemble release APK（暂用仓库内 debug.keystore 签名；配好密钥后可换正式 keystore）
        run: |
          cd android
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=debug.keystore \
            -PMYAPP_UPLOAD_KEY_ALIAS=androiddebugkey \
            -PMYAPP_UPLOAD_STORE_PASSWORD=android \
            -PMYAPP_UPLOAD_KEY_PASSWORD=android 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::gradle assembleRelease 失败，尾 60 行日志："
            tail -n 60 /tmp/gradle.log | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

      - name: Rename artifact
        run: |
          mkdir -p dist
          APP_VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "dist/XingyuMusic-v${APP_VERSION}-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/

  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs: [android]
    if: github.event_name == 'push'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: XingyuMusic ${{ github.ref_name }}
          draft: false
          make_latest: true
          files: |
            artifacts/android-apk/*
          body: |
            首个公开 Beta 版：双端液态玻璃 UI（GPU 着色器）+ 4 主题体系 + 品牌全换。

            - Android：APK（beta 阶段使用调试签名，正式签名后续版本替换）
            - Windows：安装版（NSIS）由维护者手动上传，请留意补充

            桌面端旧版提示/更新检查数据源：仓库根 `publish/version.json`。
