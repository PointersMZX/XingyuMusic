# XingyuMusic 发布流水线
# 触发：推送 v* tag → CI 打 Linux 桌面端 + Android APK，并创建 GitHub Release
# Windows 端（NSIS 安装版）由维护者自行上传到 Release 页面
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  desktop-linux:
    name: Desktop · Linux (x64/arm64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: XingyuMusic-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: XingyuMusic-desktop/package-lock.json

      - name: Install dependencies（跳过本地重编，better-sqlite3 用仓库内预编译产物）
        run: |
          npm ci --ignore-scripts
          node build-config/postinstall.js

      - name: Build dist
        run: npm run build

      - name: Package Linux artifacts
        run: |
          node build-config/build-pack.js target=linux arch=x64 type=appImage
          node build-config/build-pack.js target=linux arch=arm64 type=appImage
          node build-config/build-pack.js target=linux arch=x64 type=deb
          node build-config/build-pack.js target=linux arch=arm64 type=deb
          node build-config/build-pack.js target=linux arch=x64 type=rpm
          node build-config/build-pack.js target=linux arch=x64 type=pacman

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: build/

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: XingyuMusic-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node（.nvmrc = v18）
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Assemble release APK（暂用仓库内 debug.keystore 签名；配好密钥后可换正式 keystore）
        run: |
          cd android
          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=debug.keystore \
            -PMYAPP_UPLOAD_KEY_ALIAS=androiddebugkey \
            -PMYAPP_UPLOAD_STORE_PASSWORD=android \
            -PMYAPP_UPLOAD_KEY_PASSWORD=android

      - name: Rename artifact
        run: |
          mkdir -p dist
          APP_VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "dist/XingyuMusic-v${APP_VERSION}-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/

  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs: [desktop-linux, android]
    if: github.event_name == 'push'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: XingyuMusic ${{ github.ref_name }}
          draft: false
          make_latest: true
          files: |
            artifacts/desktop-linux/*
            artifacts/android-apk/*
          body: |
            首个公开 Beta 版：双端液态玻璃 UI（GPU 着色器）+ 4 主题体系 + 品牌全换。

            - 桌面 Linux：AppImage / deb / rpm / pacman（x64 + arm64）
            - Android：APK（beta 阶段使用调试签名，正式签名后续版本替换）
            - Windows：安装版（NSIS）由维护者手动上传，请留意补充

            更新说明与检查机制基于仓库根目录 `publish/version.json`。
