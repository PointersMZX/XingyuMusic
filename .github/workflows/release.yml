# XingyuMusic 发布流水线
# 触发：推送 v* tag → CI 打 Android APK，并创建 GitHub Release
# Windows 端（NSIS 安装版）由维护者自行上传到 Release 页面
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: XingyuMusic-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node（.nvmrc = v18）
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK（定位 sdkmanager + 接受 license + 装 compileSdk 36 / build-tools 35）
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          SDKMGR=""
          for base in "${ANDROID_HOME}" "${ANDROID_SDK_ROOT}" "/usr/lib/android-sdk" "$HOME/Android/Sdk"; do
            [ -n "$base" ] || continue
            for p in "$base/cmdline-tools/latest/bin/sdkmanager" "$base/tools/bin/sdkmanager" "$base/bin/sdkmanager"; do
              [ -x "$p" ] && { SDKMGR="$p"; break 2; }
            done
          done
          [ -z "$SDKMGR" ] && SDKMGR="$(find / -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager -> $SDKMGR"
          if [ -z "$SDKMGR" ]; then echo "::error::未找到 sdkmanager（Android SDK 缺失？）"; exit 1; fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" 2>&1 | tee /tmp/sdk.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error::SDK 组件安装失败，尾部日志："
            tail -n 40 /tmp/sdk.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Assemble release APK（暂用仓库内 debug.keystore 签名；配好密钥后可换正式 keystore）
        run: |
          cd android
          bash gradlew --no-daemon --stacktrace assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=debug.keystore \
            -PMYAPP_UPLOAD_KEY_ALIAS=androiddebugkey \
            -PMYAPP_UPLOAD_STORE_PASSWORD=android \
            -PMYAPP_UPLOAD_KEY_PASSWORD=android 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::gradle assembleRelease 失败，尾 60 行日志："
            tail -n 60 /tmp/gradle.log | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

      - name: Rename artifact
        run: |
          mkdir -p dist
          APP_VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "dist/XingyuMusic-v${APP_VERSION}-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk
          path: dist/

      - name: Upload CI logs（诊断用，始终上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-logs
          path: |
            /tmp/sdk.log
            /tmp/gradle.log

  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs: [android]
    if: github.event_name == 'push'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: XingyuMusic ${{ github.ref_name }}
          draft: false
          make_latest: true
          files: |
            artifacts/android-apk/*
          body: |
            首个公开 Beta 版：双端液态玻璃 UI（GPU 着色器）+ 4 主题体系 + 品牌全换。

            - Android：APK（beta 阶段使用调试签名，正式签名后续版本替换）
            - Windows：安装版（NSIS）由维护者手动上传，请留意补充

            桌面端旧版提示/更新检查数据源：仓库根 `publish/version.json`。
